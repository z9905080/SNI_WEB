version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - modernize
    - sqlclosecheck
  exclusions:
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      # 測試 harness 以 t.Cleanup 統一關閉 response body
      - path: _test\.go
        linters:
          - bodyclose

formatters:
  enable:
    - gofumpt
